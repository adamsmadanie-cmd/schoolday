const $=id=>document.getElementById(id);
const log=(m,ok=true)=>{const li=document.createElement('li');li.textContent=(ok?'✅ ':'❌ ')+m;$('log').appendChild(li)};
const scripts=s=>[...s.matchAll(/<script[^>]*>[\s\S]*?<\/script>/g)].map(m=>m[0]).join('\n');
$('go').onclick=async()=>{
  $('log').innerHTML='';$('dl').hidden=true;
  const f=$('file').files[0];
  if(!f){log('Choisis ton fichier HTML',false);return}
  const src=await f.text();
  if(!src.includes('FIREBASE_CONFIG')||!src.includes('id="screen-home"')){log('Ce fichier ne ressemble pas à SCHOOLDAY',false);return}
  const heroRe=/<div class="hero">[\s\S]*?(?=\s*<div class="section">)/;
  if(!heroRe.test(src)){log('Bloc accueil introuvable',false);return}
  let out=src.replace(heroRe,()=>HERO.replace(/photo\.jpg/g,PHOTO));
  log('Accueil remplacé, photo intégrée');
  if(out.includes('ACCUEIL v4')){log('CSS moderne déjà présent, conservé')}
  else{const i=out.indexOf('</style>');out=out.slice(0,i)+CSS+'\n'+out.slice(i);log('CSS moderne ajouté')}
  if(scripts(src)!==scripts(out)){log('Alerte : le JavaScript a changé, abandon',false);return}
  log('Firebase et tout le JavaScript : identiques au caractère près');
  const a=$('dl');a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));a.download='index.html';a.hidden=false;
};
</script></body></html>
